name: "Bug"
description: "Spec에 속한 재현 가능한 결함 leaf"
title: "[Bug] "
labels:
  - "bug"
  - "needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        <!-- robodata-kind:bug -->
        공개하면 위험한 취약점이나 비밀 값 노출은 이 양식에 쓰지 말고 Security Advisory로 보고하세요.
        Bug는 실행 가능한 leaf이며 부모 Spec이 필요합니다.
  - type: input
    id: parent_spec
    attributes:
      label: Parent Spec
      description: 부모 Spec issue 링크 또는 번호를 적고 가능하면 GitHub sub-issue로도 연결하세요.
      placeholder: "#123"
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: 수정 후 사용자가 얻게 될 결과를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: 실제로 발생한 동작과 오류를 적어 주세요. 비밀 값과 민감 데이터는 제거하세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: 기대한 동작을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: 최소 재현 절차, 입력 조건과 빈도를 적어 주세요.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: 수정할 동작과 경계를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: 이번 수정에서 하지 않을 일을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: 회귀 방지를 포함한 관찰 가능한 완료 조건을 체크리스트로 적어 주세요.
      placeholder: |
        - [ ] 최소 재현이 더 이상 실패하지 않는다.
        - [ ] 관련 기존 동작이 유지된다.
    validations:
      required: true
  - type: dropdown
    id: validation
    attributes:
      label: Validation profile
      description: 재현·회귀 검증을 대표하는 주 프로필을 선택하세요. 실제 명령과 결과는 PR에 기록합니다.
      options:
        - backend
        - frontend
        - fullstack
        - db
        - docker
        - docs
        - submodule
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: 선행 이슈, 외부 조건, 데이터/submodule 영향 또는 `없음`을 적어 주세요.
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size
      description: M보다 크면 여러 leaf로 나누세요. Project Size도 같은 값으로 설정합니다.
      options:
        - S
        - M
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: 사용자 영향과 긴급도를 기준으로 선택하세요.
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: 결함의 주 소유 영역을 선택하세요.
      options:
        - backend
        - frontend
        - converter
        - data
        - infra
        - docs
        - automation
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk
      description: 데이터·보안·운영 영향과 롤백 난이도를 기준으로 선택하세요.
      options:
        - low
        - medium
        - high
    validations:
      required: true
  - type: checkboxes
    id: classification
    attributes:
      label: 분류 확인
      options:
        - label: 이전에 동작하던 기능의 회귀라면 `regression` label을 추가합니다.
        - label: 배포를 막는 결함이라면 `release-blocker` label을 추가합니다.
        - label: 공개 가능한 보안 관련 후속 작업이라면 `security` label을 추가합니다.
  - type: checkboxes
    id: ready
    attributes:
      label: Ready 확인
      options:
        - label: Objective, Scope, Non-goals, Acceptance criteria, Validation profile, Dependencies가 구체적입니다.
          required: true
        - label: 이 이슈는 부모 Spec 아래의 leaf이며 하위 실행 이슈를 만들지 않습니다.
          required: true
        - label: 코드 작성 전에 claim comment와 2시간 이내 lease를 기록합니다.
          required: true
