name: PR Contract

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: pr-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contract:
    name: contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted contract from the base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Detect trusted contract
        id: trusted_contract
        run: |
          if [[ -f .github/scripts/pr_contract.py ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PR Contract will become enforceable after its bootstrap change reaches main."
          fi
      - name: Validate PR metadata
        if: steps.trusted_contract.outputs.available == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/pr_contract.py --event "$GITHUB_EVENT_PATH"
