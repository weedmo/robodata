name: Agent Control

on:
  issues:
    types: [opened, edited, reopened, closed, labeled]
  issue_comment:
    types: [created]
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize, converted_to_draft, ready_for_review, closed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: agent-project-${{ vars.PROJECT_NUMBER || 'unconfigured' }}
  queue: max
  cancel-in-progress: false

jobs:
  control:
    name: control
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Project configuration
        id: config
        env:
          PROJECTS_CLASSIC_PAT: ${{ secrets.PROJECTS_CLASSIC_PAT }}
          PROJECT_OWNER: ${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        run: |
          if [[ -n "$PROJECTS_CLASSIC_PAT" && -n "$PROJECT_OWNER" && "$PROJECT_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Agent Control is inactive until PROJECTS_CLASSIC_PAT, PROJECT_OWNER, and PROJECT_NUMBER are configured."
          fi
      - name: Check out trusted control code from main
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Python
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Apply serialized issue and Project transitions
        if: steps.config.outputs.configured == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROJECTS_CLASSIC_PAT: ${{ secrets.PROJECTS_CLASSIC_PAT }}
          PROJECT_OWNER: ${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          AGENT_LEASE_SECONDS: "7200"
          AGENT_MAX_ATTEMPTS: "3"
        run: >-
          python .github/scripts/agent_control.py
          --event "$GITHUB_EVENT_PATH"
          --event-name "$GITHUB_EVENT_NAME"
